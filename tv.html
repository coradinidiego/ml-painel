<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Expedição</title>
<style>
@font-face{font-family:"Barlow Condensed";font-weight:600;font-display:swap;src:url(/tv/fontes/barlow-condensed-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-weight:700;font-display:swap;src:url(/tv/fontes/barlow-condensed-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-weight:800;font-display:swap;src:url(/tv/fontes/barlow-condensed-latin-800-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-weight:500;font-display:swap;src:url(/tv/fontes/barlow-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-weight:600;font-display:swap;src:url(/tv/fontes/barlow-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-weight:700;font-display:swap;src:url(/tv/fontes/barlow-latin-700-normal.woff2) format("woff2")}
:root{
  --u:min(1vw,1.62vh);      /* unidade que respeita largura E altura da TV */
  --cond:"Barlow Condensed","Arial Narrow",sans-serif;
  --fundo:#171a20;          /* grafite do galpão */
  --placa:#20242c;          /* faixa da empresa */
  --placa2:#272c36;
  --linha:#323946;
  --texto:#f1f3f6;
  --apagado:#8d96a6;
  --nf:#8ab4ff;  --nf-bg:rgba(138,180,255,.07);
  --emp:#f6b94c; --emp-bg:rgba(246,185,76,.08);
  --ok:#4fd6a4;  --ok-bg:rgba(79,214,164,.07);
  --atraso:#ff5d6e;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--fundo);color:var(--texto);font-family:Barlow,system-ui,sans-serif;overflow:hidden}
body{display:grid;grid-template-rows:auto 1fr auto;padding:calc(1.2*var(--u)) calc(1.6*var(--u)) calc(.8*var(--u));gap:calc(1*var(--u));
  background:radial-gradient(calc(120*var(--u)) calc(60*var(--u)) at 50% -calc(20*var(--u)),#22272f 0%,var(--fundo) 60%)}
.n{font-family:var(--cond);font-variant-numeric:tabular-nums}

/* topo: cortes + relógio */
header{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) auto;gap:calc(.9*var(--u));align-items:stretch}
.corte{position:relative;display:grid;grid-template-columns:auto 1fr;grid-template-areas:"logo ct" "st st";align-items:center;column-gap:calc(.8*var(--u));row-gap:calc(.35*var(--u));background:var(--placa);border-radius:calc(.9*var(--u));padding:calc(.65*var(--u)) calc(1.1*var(--u)) calc(.65*var(--u)) calc(1.4*var(--u));overflow:hidden}
.corte::before{content:"";position:absolute;left:0;top:0;bottom:0;width:calc(.35*var(--u));background:var(--marca)}
.corte img{grid-area:logo;width:calc(2.6*var(--u));height:calc(2.6*var(--u));border-radius:calc(.6*var(--u));background:#fff;object-fit:contain;padding:calc(.2*var(--u))}
.corte .ct{grid-area:ct;min-width:0;display:flex;align-items:baseline;justify-content:space-between;gap:calc(.5*var(--u))}
.corte .ct b{min-width:0;font-family:var(--cond);font-size:calc(1.55*var(--u));font-weight:700;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.corte .ct span{font-family:var(--cond);font-size:calc(1.35*var(--u));font-weight:700;color:#d5dbe5;white-space:nowrap;flex:none}
.corte .st{grid-area:st;font-family:var(--cond);font-weight:800;font-size:calc(1.6*var(--u));line-height:1;white-space:nowrap}
.corte.ok .st{color:var(--ok)}
/* entrega própria (Flex / Entrega Direta): alterna com o status normal */
.st .gira{position:relative;display:block;height:1em}
.st .gira>span{position:absolute;left:0;top:0;white-space:nowrap}
.st .gira .b{color:#9fd3ff;opacity:0}
@media (prefers-reduced-motion:no-preference){
  .st .gira .a{animation:giraA 10s infinite}
  .st .gira .b{animation:giraB 10s infinite}
}
@media (prefers-reduced-motion:reduce){.st .gira .a{opacity:0}.st .gira .b{opacity:1}}
@keyframes giraA{0%,45%{opacity:1}50%,95%{opacity:0}100%{opacity:1}}
@keyframes giraB{0%,45%{opacity:0}50%,95%{opacity:1}100%{opacity:0}}
.corte.espera .st{color:var(--emp)}
.corte.alerta{background:linear-gradient(100deg,#e2414f,#ff6b4a)}
.corte.alerta::before{background:#fff}
.corte.alerta .ct span{color:#ffe4e1}
.corte.alerta .st{color:#fff}
.hora{display:flex;align-items:center;font-family:var(--cond);font-weight:700;font-size:calc(3.2*var(--u));line-height:1;padding:0 calc(.4*var(--u)) 0 calc(1*var(--u));letter-spacing:.01em}

/* faixas por empresa */
main{display:grid;grid-template-rows:repeat(3,minmax(0,1fr)) auto;gap:calc(.9*var(--u));min-height:0}
.faixa{display:grid;grid-template-columns:calc(13.5*var(--u)) minmax(0,1fr) minmax(0,1fr) minmax(0,2.6fr);background:var(--placa);border-radius:calc(1.1*var(--u));overflow:hidden;position:relative;min-height:0}
.marca{display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:calc(.6*var(--u));padding:0 calc(1.1*var(--u))}
.marca img{width:calc(4*var(--u));height:calc(4*var(--u));border-radius:calc(.8*var(--u));background:#fff;object-fit:contain;padding:calc(.25*var(--u))}
.marca b{font-size:calc(1.45*var(--u));font-weight:700;line-height:1.1}
.marca .estado{font-size:calc(.95*var(--u));font-weight:600;color:var(--apagado);line-height:1.25}
.marca .estado.pronto{color:var(--ok)}
.marca .estado.alerta{color:#fff;background:var(--atraso);border-radius:calc(.45*var(--u));padding:calc(.25*var(--u)) calc(.55*var(--u));font-weight:700}

.est{position:relative;display:flex;flex-direction:column;justify-content:center;padding:calc(.8*var(--u)) calc(1.3*var(--u));min-width:0}
.est .rot{font-size:calc(1.15*var(--u));font-weight:700;display:flex;align-items:center;gap:calc(.5*var(--u))}
.est .rot::before{content:"";width:calc(.7*var(--u));height:calc(.7*var(--u));border-radius:50%;background:currentColor}
.est .num{font-family:var(--cond);font-weight:800;font-size:calc(6*var(--u));line-height:.95}
.est.nf{background:var(--nf-bg)} .est.nf .rot,.est.nf .num{color:var(--nf)}
.est.em{background:var(--emp-bg)} .est.em .rot,.est.em .num{color:var(--emp)}
.est.zero .num{color:var(--linha)!important}
.atraso{position:absolute;top:calc(.7*var(--u));right:calc(.8*var(--u));background:var(--atraso);color:#fff;font-weight:700;font-size:calc(.9*var(--u));padding:calc(.15*var(--u)) calc(.6*var(--u));border-radius:calc(2*var(--u))}
.chips{display:flex;flex-wrap:wrap;gap:calc(.3*var(--u)) calc(.7*var(--u));margin-top:calc(.4*var(--u));min-height:calc(1.4*var(--u))}
.chip{display:inline-flex;align-items:center;gap:calc(.3*var(--u));font-size:calc(.95*var(--u));font-weight:600;color:#cfd5df}
.chip i{width:calc(.55*var(--u));height:calc(.55*var(--u));border-radius:50%}
.chip b{font-family:var(--cond);font-size:calc(1.25*var(--u));color:#fff}

/* A coletar: um bloco por marketplace + total da empresa */
.coletar{background:var(--ok-bg);display:grid;grid-template-rows:auto 1fr auto;padding:calc(.8*var(--u)) calc(1.2*var(--u)) calc(.7*var(--u));gap:calc(.5*var(--u));min-width:0}
.coletar .rot{color:var(--ok)}
.mkts{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:calc(.6*var(--u));min-height:0}
.mkt{position:relative;background:var(--placa2);border-radius:calc(.7*var(--u));padding:calc(.55*var(--u)) calc(.8*var(--u)) calc(.4*var(--u));display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;min-width:0}
.mkt::before{content:"";position:absolute;left:0;right:0;top:0;height:calc(.3*var(--u));background:var(--marca)}
.mkt span{font-size:calc(1*var(--u));font-weight:700;color:#d6dbe3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mkt b{font-family:var(--cond);font-weight:800;font-size:calc(3.6*var(--u));line-height:.95;color:var(--texto)}
.mkt.zero{background:transparent;box-shadow:inset 0 0 0 1px var(--linha)}
.mkt.zero b{color:var(--linha)}
.mkt.zero span{color:var(--apagado)}
.total{display:flex;align-items:baseline;justify-content:space-between;border-top:1px solid rgba(79,214,164,.25);padding-top:calc(.35*var(--u))}
.total span{font-size:calc(1.05*var(--u));font-weight:700;color:var(--ok)}
.total b{font-family:var(--cond);font-weight:800;font-size:calc(2.6*var(--u));line-height:1;color:var(--ok)}

.lado{display:flex;flex-direction:column;justify-content:center;gap:calc(1*var(--u));padding:0 calc(1.1*var(--u))}
.lado div{font-size:calc(.9*var(--u));color:var(--apagado);font-weight:600;line-height:1.15}
.lado b{display:block;font-family:var(--cond);font-size:calc(2.4*var(--u));font-weight:700;color:var(--texto);line-height:1}

.faixa.alerta{box-shadow:inset 0 0 0 calc(.28*var(--u)) var(--atraso)}
.faixa.carregando .num,.faixa.carregando .mkt b,.faixa.carregando .total b,.faixa.carregando .lado b{color:var(--linha)!important}
.faixa.velho::after{content:"Sem atualização recente";position:absolute;bottom:calc(.5*var(--u));left:calc(1.3*var(--u));font-size:calc(.85*var(--u));font-weight:700;color:var(--atraso)}
@media (prefers-reduced-motion:no-preference){.corte.alerta,.faixa.alerta{animation:pulso 1.8s ease-in-out infinite}}
@keyframes pulso{50%{filter:brightness(1.22)}}

footer{display:flex;justify-content:space-between;font-size:calc(.65*var(--u));color:#5d6575;font-weight:500}
/* total geral (todas as empresas): faixa compacta no fim, alinhada com as colunas de cima */
.faixa.geral{background:transparent;box-shadow:inset 0 0 0 1px var(--linha)}
.faixa.geral .marca b{font-size:calc(1.25*var(--u));color:var(--apagado)}
.faixa.geral .rot{display:none}
.faixa.geral .est{flex-direction:row;align-items:center;justify-content:flex-start;gap:calc(1*var(--u));padding:calc(.45*var(--u)) calc(1.3*var(--u))}
.faixa.geral .est .num{font-size:calc(3.4*var(--u))}
.faixa.geral .chips{margin:0;flex-direction:row;flex-wrap:wrap;gap:calc(.1*var(--u)) calc(.6*var(--u));max-width:calc(16*var(--u))}
.faixa.geral .coletar{display:flex;align-items:center;gap:calc(.8*var(--u));padding:calc(.45*var(--u)) calc(1.2*var(--u))}
.faixa.geral .coletar>.est{display:none}
.faixa.geral .mkts{flex:1;display:flex;gap:calc(.6*var(--u))}
.faixa.geral .mkt{flex:1;padding:calc(.45*var(--u)) calc(.7*var(--u)) calc(.3*var(--u))}
.faixa.geral .mkt span{font-size:calc(.85*var(--u))}
.faixa.geral .mkt b{font-size:calc(2.3*var(--u))}
.faixa.geral .total{flex-direction:column;align-items:flex-end;border:0;padding:0;gap:calc(.1*var(--u))}
.faixa.geral .total span{font-size:calc(.85*var(--u));white-space:nowrap}
.faixa.geral .total b{font-size:calc(3.4*var(--u))}
footer .erro{color:var(--emp)}
.aviso{position:fixed;inset:0;display:grid;place-items:center;background:var(--fundo);font-size:calc(1.8*var(--u));color:var(--apagado);text-align:center;padding:calc(4*var(--u))}
</style>
</head>
<body>
<header><div id="cortes" style="display:contents"></div><div class="hora n" id="hora">--:--</div></header>
<main id="faixas"></main>
<footer><span id="atualizado"></span><span id="erros" class="erro"></span></footer>
<div class="aviso" id="aviso">Carregando pedidos dos marketplaces…</div>

<script>
const CORES = { 'Mercado Livre':'#ffe600', 'Amazon':'#ff9900', 'Shopee':'#ee4d2d', 'Shein':'#d9d9d9', 'TikTok':'#25f4ee', 'Outros':'#8d96a6' };
const CURTO = { 'Mercado Livre':'ML' };
const SLUG = { 'Mercado Livre':'ml', 'Amazon':'amazon', 'Shopee':'shopee', 'Shein':'shein', 'TikTok':'tiktok' };
const logoMkt = c => SLUG[c] ? `<img src="/tv/marca/${SLUG[c]}" alt="" onerror="this.remove()">` : '';
const ORDEM = ['Mercado Livre','Amazon','Shopee','Shein','TikTok'];
const $ = id => document.getElementById(id);
const fmt = n => (n ?? 0).toLocaleString('pt-BR');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function relogio(){ $('hora').textContent = new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}); }
setInterval(relogio, 1000); relogio();

function chips(e, etapa){
  return e.canais.filter(c => c[etapa] > 0)
    .map(c => `<span class="chip"><i style="background:${CORES[c.canal]||CORES.Outros}"></i>${esc(CURTO[c.canal]||c.canal)} <b>${fmt(c[etapa])}</b></span>`).join('');
}
function estacao(e, etapa, classe, rotulo){
  const v = e.total[etapa];
  const atraso = e.canais.reduce((s,c)=> s + (c[etapa] ? Math.min(c.atrasados, c[etapa]) : 0), 0);
  return `<div class="est ${classe} ${v ? '' : 'zero'}">
    ${atraso ? `<span class="atraso">${fmt(atraso)} atrasado${atraso>1?'s':''}</span>` : ''}
    <div class="rot">${rotulo}</div>
    <div class="num">${fmt(v)}</div>
    <div class="chips">${chips(e, etapa)}</div>
  </div>`;
}
function coletar(e){
  const lista = ORDEM.filter(m => e.canais.some(c => c.canal === m))
    .concat(e.canais.map(c => c.canal).filter(m => !ORDEM.includes(m) && e.canais.find(c => c.canal === m).empacotado));
  const blocos = lista.map(m => { const v = e.canais.find(c => c.canal === m)?.empacotado || 0;
    return `<div class="mkt ${v ? '' : 'zero'}" style="--marca:${CORES[m]||CORES.Outros}"><span>${esc(CURTO[m]||m)}</span><b>${fmt(v)}</b></div>`; }).join('');
  return `<div class="coletar"><div class="est" style="padding:0;background:none"><div class="rot" style="color:var(--ok)">A coletar</div></div>
    <div class="mkts" style="grid-template-columns:repeat(${Math.max(lista.length,4)},minmax(0,1fr))">${blocos}</div>
    <div class="total"><span>Total a coletar</span><b>${fmt(e.total.empacotado)}</b></div></div>`;
}
function corte(r, carregando){
  if (carregando) return `<div class="corte" style="--marca:${CORES[r.canal]}">${logoMkt(r.canal)}<div class="ct"><b>${esc(r.titulo)}</b><span>${esc(r.texto)}</span></div><div class="st" style="color:var(--apagado)">carregando…</div></div>`;
  if (r.semCorte) return `<div class="corte" style="--marca:${CORES[r.canal]}">${logoMkt(r.canal)}<div class="ct"><b>${esc(r.titulo)}</b><span></span></div><div class="st" style="color:var(--apagado)">sem corte hoje</div></div>`;
  const cls = !r.pendentes ? 'ok' : r.atrasados ? 'alerta' : 'espera';
  const st = !r.pendentes ? '✓ tudo pronto' : r.atrasados ? `⚠ ${fmt(r.atrasados)} fora do corte` : `${fmt(r.pendentes)} para o corte`;
  return `<div class="corte ${cls}" style="--marca:${CORES[r.canal]}">${logoMkt(r.canal)}
    <div class="ct"><b>${esc(r.titulo)}</b><span>${esc(r.texto)}</span></div>
    <div class="st">${r.proprio?.pendentes ? `<span class="gira"><span class="a">${st}</span><span class="b">🛵 ${fmt(r.proprio.pendentes)} ${esc(r.proprio.nome)} hoje</span></span>` : st}</div></div>`;
}
function alertasDe(e){
  return (e.canais||[]).filter(c => c.corte > 0 && e.alertas?.[c.canal]).map(c => `${CURTO[c.canal]||c.canal} ${fmt(c.corte)}`);
}
function geral(emps){
  // Total do dia: "a coletar" + o que já foi coletado/enviado hoje (não zera depois da coleta)
  const canais = {}, total = {emitirNF:0,aEmpacotar:0,empacotado:0,atrasados:0};
  for (const e of emps) for (const c of e.canais||[]) {
    const g = canais[c.canal] ||= {canal:c.canal,emitirNF:0,aEmpacotar:0,empacotado:0,atrasados:0};
    const v = {emitirNF:c.emitirNF||0, aEmpacotar:c.aEmpacotar||0, empacotado:(c.empacotado||0)+(c.enviado||0), atrasados:c.atrasados||0};
    for (const k in total) { g[k] += v[k]; total[k] += v[k]; }
  }
  const e = { canais:Object.values(canais), total };
  return `<section class="faixa geral">
    <div class="marca"><b>Todas as empresas</b></div>
    ${estacao(e,'emitirNF','nf','Emitir NF')}
    ${estacao(e,'aEmpacotar','em','A empacotar')}
    ${coletar(e).replace('Total a coletar','Feitos hoje')}
  </section>`;
}
function atrasosDe(e){
  return (e.canais||[]).filter(c => c.atrasoTotal > 0).map(c => `${CURTO[c.canal]||c.canal} ${fmt(c.atrasoTotal)}`);
}
function faixa(e){
  const t = e.total, pendente = t.emitirNF + t.aEmpacotar, al = alertasDe(e), at = atrasosDe(e), nAt = t.atrasoTotal || 0;
  const estado = e.carregando ? 'Carregando…'
    : e.carregandoErp ? 'Carregando outros canais…'
    : pendente === 0 && t.empacotado > 0 ? 'Tudo empacotado, aguardando coleta'
    : pendente === 0 && t.enviado > 0 ? 'Tudo enviado'
    : pendente === 0 ? 'Sem pedidos pendentes'
    : `${fmt(pendente)} para preparar`;
  return `<section class="faixa ${e.carregando?'carregando':''} ${e.desatualizado?'velho':''} ${(al.length||nAt)?'alerta':''}">
    <div class="marca"><img src="/logo/${esc(e.logo)}" alt=""><b>${esc(e.nome)}</b>${al.length
      ? `<span class="estado alerta">⚠ Fora do corte: ${esc(al.join(', '))}</span>`
      : `<span class="estado ${pendente===0&&!e.carregando?'pronto':''}">${estado}</span>`}${nAt
      ? `<span class="estado alerta">⚠ ${fmt(nAt)} atrasado${nAt>1?'s':''}: ${esc(at.join(', '))}</span>` : ''}</div>
    ${estacao(e,'emitirNF','nf','Emitir NF')}
    ${estacao(e,'aEmpacotar','em','A empacotar')}
    ${coletar(e)}
  </section>`;
}

async function carregar(){
  try{
    const r = await fetch('/tv/dados', {cache:'no-store'});
    if (r.status === 401) { $('aviso').style.display='grid'; $('aviso').textContent = 'Esta TV ainda não tem acesso. Abra o link da TV que está em Conta → Painel da TV.'; return; }
    const d = await r.json();
    if (d.carregando || !d.empresas?.length) { setTimeout(carregar, 4000); return; }
    $('aviso').style.display = 'none';
    $('faixas').innerHTML = d.empresas.map(faixa).join('') + geral(d.empresas);
    $('cortes').innerHTML = (d.cortes||[]).map(r => corte(r, d.parcial)).join('');
    if (d.parcial) setTimeout(carregar, 4000);
    $('atualizado').textContent = d.atualizadoEm && !d.parcial
      ? 'Atualizado às ' + new Date(d.atualizadoEm).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}) + '. Atualiza sozinho a cada 1 a 2 minutos.'
      : 'Carregando as demais empresas…';
    const erros = Object.entries(d.erros||{}).map(([k,v]) => `${k}: ${v}`);
    if (!d.configurado && !d.parcial) erros.unshift('Situações do Bling/Tiny ainda não revisadas em /tv/config');
    $('erros').textContent = erros.join('  |  ');
  }catch(e){ $('erros').textContent = 'Sem conexão com o servidor. Tentando de novo…'; }
}
carregar(); setInterval(carregar, 30000);
setTimeout(() => location.reload(), 6 * 3600e3);
try { navigator.wakeLock?.request('screen').catch(()=>{}); } catch(e){}
</script>
</body>
</html>
