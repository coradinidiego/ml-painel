<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Expedição — pedidos do dia</title>
<style>
@font-face{font-family:var(--cond);font-weight:600;font-style:normal;font-display:swap;src:url(/tv/fontes/barlow-condensed-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:var(--cond);font-weight:700;font-style:normal;font-display:swap;src:url(/tv/fontes/barlow-condensed-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:var(--cond);font-weight:800;font-style:normal;font-display:swap;src:url(/tv/fontes/barlow-condensed-latin-800-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-weight:500;font-style:normal;font-display:swap;src:url(/tv/fontes/barlow-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-weight:600;font-style:normal;font-display:swap;src:url(/tv/fontes/barlow-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-weight:700;font-style:normal;font-display:swap;src:url(/tv/fontes/barlow-latin-700-normal.woff2) format("woff2")}
:root{
  --cond:"Barlow Condensed","Arial Narrow","Roboto Condensed",sans-serif;
  --fundo:#0f1d33;      /* azul-marinho do galpão */
  --faixa:#16284a;
  --estacao:#1d3360;
  --linha:#2a4476;
  --texto:#f3f6fb;
  --apagado:#8ea3c7;
  --nf:#6cc4ff;         /* documento */
  --emp:#ffbf3c;        /* fita adesiva */
  --ok:#43d99a;         /* pronto */
  --atraso:#ff5a6e;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--fundo);color:var(--texto);font-family:Barlow,system-ui,sans-serif;overflow:hidden}
body{display:grid;grid-template-rows:auto 1fr auto;padding:1.5vw 2vw 1vw;gap:1.2vw}
.n{font-family:var(--cond);font-variant-numeric:tabular-nums}

/* cabeçalho */
header{display:flex;align-items:flex-end;gap:2vw}
header h1{font-family:var(--cond);font-weight:800;font-size:3.2vw;line-height:.9;letter-spacing:-.01em}
header .data{font-size:1.2vw;color:var(--apagado);font-weight:600;margin-top:.4vw}
.legenda{display:flex;gap:1.6vw;margin-left:auto;align-items:center;font-size:1.05vw;font-weight:600;color:var(--apagado)}
.legenda i{display:inline-block;width:.9vw;height:.9vw;border-radius:.2vw;margin-right:.45vw;vertical-align:-.05vw}
.hora{font-family:var(--cond);font-weight:700;font-size:3.4vw;line-height:.9;margin-left:1.5vw}

/* faixas por empresa */
main{display:grid;grid-template-rows:repeat(3,1fr);gap:1vw;min-height:0}
.faixa{display:grid;grid-template-columns:15vw repeat(3,minmax(0,1fr)) 11vw;align-items:stretch;gap:0;background:var(--faixa);border-radius:1.1vw;overflow:hidden;position:relative}
.marca{display:flex;flex-direction:column;justify-content:center;gap:.7vw;padding:0 1.4vw;border-right:1px solid var(--linha)}
.marca img{width:4.2vw;height:4.2vw;border-radius:.8vw;background:#fff;object-fit:contain;padding:.25vw}
.marca b{font-size:1.45vw;font-weight:700;line-height:1.1}
.marca .estado{font-size:.95vw;font-weight:600;color:var(--apagado)}
.marca .estado.pronto{color:var(--ok)}

.est{position:relative;display:flex;flex-direction:column;justify-content:center;padding:.6vw 1.6vw .6vw 2.6vw;border-right:1px solid var(--linha)}
.est::before{                       /* seta do fluxo entre estações */
  content:"";position:absolute;left:-1px;top:50%;width:1.1vw;height:1.1vw;transform:translate(-50%,-50%) rotate(45deg);
  background:var(--faixa);border-top:1px solid var(--linha);border-right:1px solid var(--linha)}
.est .rot{display:flex;align-items:center;gap:.6vw;font-size:1.15vw;font-weight:700}
.est .rot .passo{width:1.6vw;height:1.6vw;border-radius:50%;display:grid;place-items:center;font-size:.9vw;font-weight:800;color:var(--fundo)}
.est .num{font-family:var(--cond);font-weight:800;font-size:6.4vw;line-height:.95;margin-top:.1vw}
.est.zero .num{color:var(--linha)!important}
.est.nf .passo{background:var(--nf)}  .est.nf .num,.est.nf .rot{color:var(--nf)}
.est.em .passo{background:var(--emp)} .est.em .num,.est.em .rot{color:var(--emp)}
.est.ok .passo{background:var(--ok)}  .est.ok .num,.est.ok .rot{color:var(--ok)}
.est.vazio .rot{color:var(--apagado)}
.atraso{position:absolute;top:.8vw;right:1vw;background:var(--atraso);color:#fff;font-weight:700;font-size:.95vw;padding:.2vw .65vw;border-radius:2vw}

.canais{display:flex;flex-wrap:wrap;gap:.35vw;margin-top:.5vw;min-height:1.7vw;max-height:4vw;overflow:hidden}
.canal{flex:none;display:inline-flex;align-items:center;gap:.3vw;background:rgba(255,255,255,.06);border-radius:.45vw;padding:.15vw .5vw;font-size:.95vw;font-weight:600;color:#d7e1f2}
.canal i{width:.6vw;height:.6vw;border-radius:50%;display:inline-block}
.canal b{font-family:var(--cond);font-size:1.25vw;font-weight:700;color:#fff}

.lado{display:flex;flex-direction:column;justify-content:center;gap:1vw;padding:0 1.3vw}
.lado div{font-size:.95vw;color:var(--apagado);font-weight:600;line-height:1.15}
.lado b{display:block;font-family:var(--cond);font-size:2.4vw;font-weight:700;color:var(--texto);line-height:1}

.faixa.carregando .est .num,.faixa.carregando .lado b{color:var(--linha)}
.faixa.velho::after{content:"Sem atualização recente";position:absolute;bottom:.6vw;left:1.4vw;font-size:.85vw;font-weight:700;color:var(--atraso)}

footer{display:flex;justify-content:space-between;font-size:.95vw;color:var(--apagado);font-weight:500}
footer .erro{color:var(--emp)}
.aviso{position:fixed;inset:0;display:grid;place-items:center;background:var(--fundo);font-size:1.8vw;color:var(--apagado);text-align:center;padding:4vw}
@media (prefers-reduced-motion:no-preference){.num{transition:color .4s}}
</style>
</head>
<body>
<header>
  <div><h1>Pedidos do dia</h1><div class="data" id="data"></div></div>
  <div class="legenda">
    <span><i style="background:var(--nf)"></i>Emitir NF</span>
    <span><i style="background:var(--emp)"></i>A empacotar</span>
    <span><i style="background:var(--ok)"></i>A coletar</span>
  </div>
  <div class="hora n" id="hora">--:--</div>
</header>
<main id="faixas"></main>
<footer><span id="atualizado"></span><span id="erros" class="erro"></span></footer>
<div class="aviso" id="aviso">Carregando pedidos dos marketplaces…</div>

<script>
const CORES = { 'Mercado Livre':'#ffe600', 'Amazon':'#ff9900', 'Shopee':'#ff5a36', 'Shein':'#e9e9e9', 'TikTok':'#ff2d6f', 'Outros':'#8ea3c7' };
const CURTO = { 'Mercado Livre':'ML' };
const $ = id => document.getElementById(id);
const fmt = n => (n ?? 0).toLocaleString('pt-BR');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function relogio(){
  const d = new Date();
  $('hora').textContent = d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  const t = d.toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'});
  $('data').textContent = t.charAt(0).toUpperCase() + t.slice(1);
}
setInterval(relogio, 1000); relogio();

function chips(e, etapa){
  return e.canais.filter(c => c[etapa] > 0)
    .map(c => `<span class="canal"><i style="background:${CORES[c.canal]||CORES.Outros}"></i>${esc(CURTO[c.canal]||c.canal)} <b>${fmt(c[etapa])}</b></span>`).join('');
}
function estacao(e, etapa, classe, passo, rotulo){
  const v = e.total[etapa];
  const atraso = etapa !== 'empacotado' ? e.canais.reduce((s,c)=> s + (c[etapa] ? Math.min(c.atrasados, c[etapa]) : 0), 0) : 0;
  return `<div class="est ${classe} ${v ? '' : 'zero'}">
    ${atraso ? `<span class="atraso">${fmt(atraso)} atrasado${atraso>1?'s':''}</span>` : ''}
    <div class="rot"><span class="passo">${passo}</span>${rotulo}</div>
    <div class="num">${fmt(v)}</div>
    <div class="canais">${chips(e, etapa)}</div>
  </div>`;
}
function faixa(e){
  const t = e.total, pendente = t.emitirNF + t.aEmpacotar;
  const estado = e.carregando ? 'Carregando…'
    : e.carregandoErp ? 'Carregando outros canais…'
    : pendente === 0 && t.empacotado > 0 ? 'Tudo empacotado, aguardando coleta'
    : pendente === 0 && t.enviado > 0 ? 'Tudo enviado'
    : pendente === 0 ? 'Sem pedidos pendentes'
    : `${fmt(pendente)} para preparar`;
  return `<section class="faixa ${e.carregando?'carregando':''} ${e.desatualizado?'velho':''}">
    <div class="marca"><img src="/logo/${esc(e.logo)}" alt=""><b>${esc(e.nome)}</b><span class="estado ${pendente===0&&!e.carregando?'pronto':''}">${estado}</span></div>
    ${estacao(e,'emitirNF','nf',1,'Emitir NF')}
    ${estacao(e,'aEmpacotar','em',2,'A empacotar')}
    ${estacao(e,'empacotado','ok',3,'A coletar')}
    <div class="lado">
      <div><b class="n">${fmt(t.enviado)}</b>enviados hoje</div>
      <div><b class="n">${fmt(t.futuros)}</b>próximos dias</div>
    </div>
  </section>`;
}

async function carregar(){
  try{
    const r = await fetch('/tv/dados', {cache:'no-store'});
    if (r.status === 401) { $('aviso').style.display='grid'; $('aviso').textContent = 'Esta TV ainda não tem acesso. Abra o link da TV que está em Conta → Painel da TV.'; return; }
    const d = await r.json();
    if (d.carregando || !d.empresas?.length) { setTimeout(carregar, 4000); return; }
    $('aviso').style.display = 'none';
    $('faixas').innerHTML = d.empresas.map(faixa).join('');
    if (d.parcial) setTimeout(carregar, 4000);
    $('atualizado').textContent = d.atualizadoEm && !d.parcial
      ? 'Atualizado às ' + new Date(d.atualizadoEm).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}) + '. Atualiza sozinho a cada 1 a 2 minutos.'
      : 'Carregando as demais empresas…';
    const erros = Object.entries(d.erros||{}).map(([k,v]) => `${k}: ${v}`);
    if (!d.configurado && !d.parcial) erros.unshift('Situações do Bling/Tiny ainda não revisadas em /tv/config');
    $('erros').textContent = erros.join('  |  ');
  }catch(e){ $('erros').textContent = 'Sem conexão com o servidor. Tentando de novo…'; }
}
carregar(); setInterval(carregar, 30000);
setTimeout(() => location.reload(), 6 * 3600e3);
try { navigator.wakeLock?.request('screen').catch(()=>{}); } catch(e){}
</script>
</body>
</html>
