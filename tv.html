<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Expedição</title>
<style>
@font-face{font-family:"Barlow Condensed";font-weight:600;font-display:swap;src:url(/tv/fontes/barlow-condensed-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-weight:700;font-display:swap;src:url(/tv/fontes/barlow-condensed-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-weight:800;font-display:swap;src:url(/tv/fontes/barlow-condensed-latin-800-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-weight:500;font-display:swap;src:url(/tv/fontes/barlow-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-weight:600;font-display:swap;src:url(/tv/fontes/barlow-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-weight:700;font-display:swap;src:url(/tv/fontes/barlow-latin-700-normal.woff2) format("woff2")}
:root{
  --cond:"Barlow Condensed","Arial Narrow",sans-serif;
  --fundo:#171a20;          /* grafite do galpão */
  --placa:#20242c;          /* faixa da empresa */
  --placa2:#272c36;
  --linha:#323946;
  --texto:#f1f3f6;
  --apagado:#8d96a6;
  --nf:#8ab4ff;  --nf-bg:rgba(138,180,255,.07);
  --emp:#f6b94c; --emp-bg:rgba(246,185,76,.08);
  --ok:#4fd6a4;  --ok-bg:rgba(79,214,164,.07);
  --atraso:#ff5d6e;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--fundo);color:var(--texto);font-family:Barlow,system-ui,sans-serif;overflow:hidden}
body{display:grid;grid-template-rows:auto 1fr auto;padding:1.2vw 1.6vw .8vw;gap:1vw;
  background:radial-gradient(120vw 60vw at 50% -20vw,#22272f 0%,var(--fundo) 60%)}
.n{font-family:var(--cond);font-variant-numeric:tabular-nums}

/* topo: cortes + relógio */
header{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:.9vw;align-items:stretch}
.corte{position:relative;display:flex;align-items:center;gap:1vw;background:var(--placa);border-radius:.9vw;padding:.7vw 1.2vw .7vw 1.5vw;overflow:hidden}
.corte::before{content:"";position:absolute;left:0;top:0;bottom:0;width:.35vw;background:var(--marca)}
.corte .ct{flex:1;min-width:0}
.corte .ct b{display:block;font-size:1.25vw;font-weight:700;line-height:1.1;white-space:nowrap}
.corte .ct span{display:block;font-size:.9vw;color:var(--apagado);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.corte .st{font-family:var(--cond);font-weight:800;font-size:1.75vw;white-space:nowrap;text-align:right;line-height:1}
.corte .st small{display:block;font-family:Barlow,sans-serif;font-size:.8vw;font-weight:600;color:var(--apagado);margin-top:.15vw}
.corte.ok .st{color:var(--ok)}
.corte.espera .st{color:var(--emp)}
.corte.alerta{background:linear-gradient(100deg,#e2414f,#ff6b4a)}
.corte.alerta::before{background:#fff}
.corte.alerta .ct span,.corte.alerta .st small{color:#ffe4e1}
.corte.alerta .st{color:#fff}
.hora{display:flex;align-items:center;font-family:var(--cond);font-weight:700;font-size:3.6vw;line-height:1;padding:0 .4vw 0 1vw;letter-spacing:.01em}

/* faixas por empresa */
main{display:grid;grid-template-rows:repeat(3,1fr);gap:.9vw;min-height:0}
.faixa{display:grid;grid-template-columns:13.5vw minmax(0,1fr) minmax(0,1fr) minmax(0,2.3fr) 8.5vw;background:var(--placa);border-radius:1.1vw;overflow:hidden;position:relative;min-height:0}
.marca{display:flex;flex-direction:column;justify-content:center;gap:.6vw;padding:0 1.3vw}
.marca img{width:4vw;height:4vw;border-radius:.8vw;background:#fff;object-fit:contain;padding:.25vw}
.marca b{font-size:1.45vw;font-weight:700;line-height:1.1}
.marca .estado{font-size:.95vw;font-weight:600;color:var(--apagado);line-height:1.25}
.marca .estado.pronto{color:var(--ok)}
.marca .estado.alerta{color:#fff;background:var(--atraso);border-radius:.45vw;padding:.25vw .55vw;font-weight:700}

.est{position:relative;display:flex;flex-direction:column;justify-content:center;padding:.8vw 1.3vw;min-width:0}
.est .rot{font-size:1.15vw;font-weight:700;display:flex;align-items:center;gap:.5vw}
.est .rot::before{content:"";width:.7vw;height:.7vw;border-radius:50%;background:currentColor}
.est .num{font-family:var(--cond);font-weight:800;font-size:6vw;line-height:.95}
.est.nf{background:var(--nf-bg)} .est.nf .rot,.est.nf .num{color:var(--nf)}
.est.em{background:var(--emp-bg)} .est.em .rot,.est.em .num{color:var(--emp)}
.est.zero .num{color:var(--linha)!important}
.atraso{position:absolute;top:.7vw;right:.8vw;background:var(--atraso);color:#fff;font-weight:700;font-size:.9vw;padding:.15vw .6vw;border-radius:2vw}
.chips{display:flex;flex-wrap:wrap;gap:.3vw .7vw;margin-top:.4vw;min-height:1.4vw}
.chip{display:inline-flex;align-items:center;gap:.3vw;font-size:.95vw;font-weight:600;color:#cfd5df}
.chip i{width:.55vw;height:.55vw;border-radius:50%}
.chip b{font-family:var(--cond);font-size:1.25vw;color:#fff}

/* A coletar: um bloco por marketplace + total da empresa */
.coletar{background:var(--ok-bg);display:grid;grid-template-rows:auto 1fr auto;padding:.8vw 1.2vw .7vw;gap:.5vw;min-width:0}
.coletar .rot{color:var(--ok)}
.mkts{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:.6vw;min-height:0}
.mkt{position:relative;background:var(--placa2);border-radius:.7vw;padding:.55vw .8vw .4vw;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;min-width:0}
.mkt::before{content:"";position:absolute;left:0;right:0;top:0;height:.3vw;background:var(--marca)}
.mkt span{font-size:1vw;font-weight:700;color:#d6dbe3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mkt b{font-family:var(--cond);font-weight:800;font-size:3.6vw;line-height:.95;color:var(--texto)}
.mkt.zero{background:transparent;box-shadow:inset 0 0 0 1px var(--linha)}
.mkt.zero b{color:var(--linha)}
.mkt.zero span{color:var(--apagado)}
.total{display:flex;align-items:baseline;justify-content:space-between;border-top:1px solid rgba(79,214,164,.25);padding-top:.35vw}
.total span{font-size:1.05vw;font-weight:700;color:var(--ok)}
.total b{font-family:var(--cond);font-weight:800;font-size:2.6vw;line-height:1;color:var(--ok)}

.lado{display:flex;flex-direction:column;justify-content:center;gap:1vw;padding:0 1.1vw}
.lado div{font-size:.9vw;color:var(--apagado);font-weight:600;line-height:1.15}
.lado b{display:block;font-family:var(--cond);font-size:2.4vw;font-weight:700;color:var(--texto);line-height:1}

.faixa.alerta{box-shadow:inset 0 0 0 .28vw var(--atraso)}
.faixa.carregando .num,.faixa.carregando .mkt b,.faixa.carregando .total b,.faixa.carregando .lado b{color:var(--linha)!important}
.faixa.velho::after{content:"Sem atualização recente";position:absolute;bottom:.5vw;left:1.3vw;font-size:.85vw;font-weight:700;color:var(--atraso)}
@media (prefers-reduced-motion:no-preference){.corte.alerta,.faixa.alerta{animation:pulso 1.8s ease-in-out infinite}}
@keyframes pulso{50%{filter:brightness(1.22)}}

footer{display:flex;justify-content:space-between;font-size:.9vw;color:var(--apagado);font-weight:500}
footer .erro{color:var(--emp)}
.aviso{position:fixed;inset:0;display:grid;place-items:center;background:var(--fundo);font-size:1.8vw;color:var(--apagado);text-align:center;padding:4vw}
</style>
</head>
<body>
<header><div id="cortes" style="display:contents"></div><div class="hora n" id="hora">--:--</div></header>
<main id="faixas"></main>
<footer><span id="atualizado"></span><span id="erros" class="erro"></span></footer>
<div class="aviso" id="aviso">Carregando pedidos dos marketplaces…</div>

<script>
const CORES = { 'Mercado Livre':'#ffe600', 'Amazon':'#ff9900', 'Shopee':'#ee4d2d', 'Shein':'#d9d9d9', 'TikTok':'#25f4ee', 'Outros':'#8d96a6' };
const CURTO = { 'Mercado Livre':'ML' };
const ORDEM = ['Mercado Livre','Amazon','Shopee','Shein','TikTok'];
const $ = id => document.getElementById(id);
const fmt = n => (n ?? 0).toLocaleString('pt-BR');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function relogio(){ $('hora').textContent = new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}); }
setInterval(relogio, 1000); relogio();

function chips(e, etapa){
  return e.canais.filter(c => c[etapa] > 0)
    .map(c => `<span class="chip"><i style="background:${CORES[c.canal]||CORES.Outros}"></i>${esc(CURTO[c.canal]||c.canal)} <b>${fmt(c[etapa])}</b></span>`).join('');
}
function estacao(e, etapa, classe, rotulo){
  const v = e.total[etapa];
  const atraso = e.canais.reduce((s,c)=> s + (c[etapa] ? Math.min(c.atrasados, c[etapa]) : 0), 0);
  return `<div class="est ${classe} ${v ? '' : 'zero'}">
    ${atraso ? `<span class="atraso">${fmt(atraso)} atrasado${atraso>1?'s':''}</span>` : ''}
    <div class="rot">${rotulo}</div>
    <div class="num">${fmt(v)}</div>
    <div class="chips">${chips(e, etapa)}</div>
  </div>`;
}
function coletar(e){
  const lista = ORDEM.filter(m => e.canais.some(c => c.canal === m))
    .concat(e.canais.map(c => c.canal).filter(m => !ORDEM.includes(m) && e.canais.find(c => c.canal === m).empacotado));
  const blocos = lista.map(m => { const v = e.canais.find(c => c.canal === m)?.empacotado || 0;
    return `<div class="mkt ${v ? '' : 'zero'}" style="--marca:${CORES[m]||CORES.Outros}"><span>${esc(CURTO[m]||m)}</span><b>${fmt(v)}</b></div>`; }).join('');
  return `<div class="coletar"><div class="est" style="padding:0;background:none"><div class="rot" style="color:var(--ok)">A coletar</div></div>
    <div class="mkts" style="grid-template-columns:repeat(${Math.max(lista.length,4)},minmax(0,1fr))">${blocos}</div>
    <div class="total"><span>Total a coletar</span><b>${fmt(e.total.empacotado)}</b></div></div>`;
}
function corte(r){
  const cls = !r.pendentes ? 'ok' : r.atrasados ? 'alerta' : 'espera';
  const st = !r.pendentes ? '✓ tudo pronto' : r.atrasados ? `⚠ ${fmt(r.atrasados)} fora do corte` : `${fmt(r.pendentes)} para o corte`;
  const sub = r.alertaDesde ? (r.atrasados ? 'alerta desde ' : 'alerta às ') + r.alertaDesde : '';
  return `<div class="corte ${cls}" style="--marca:${CORES[r.canal]}">
    <div class="ct"><b>${esc(r.titulo)}</b><span>${esc(r.texto)}</span></div>
    <div class="st">${st}<small>${sub}</small></div></div>`;
}
function alertasDe(e){
  return (e.canais||[]).filter(c => c.corte > 0 && e.alertas?.[c.canal]).map(c => `${CURTO[c.canal]||c.canal} ${fmt(c.corte)}`);
}
function faixa(e){
  const t = e.total, pendente = t.emitirNF + t.aEmpacotar, al = alertasDe(e);
  const estado = e.carregando ? 'Carregando…'
    : e.carregandoErp ? 'Carregando outros canais…'
    : pendente === 0 && t.empacotado > 0 ? 'Tudo empacotado, aguardando coleta'
    : pendente === 0 && t.enviado > 0 ? 'Tudo enviado'
    : pendente === 0 ? 'Sem pedidos pendentes'
    : `${fmt(pendente)} para preparar`;
  return `<section class="faixa ${e.carregando?'carregando':''} ${e.desatualizado?'velho':''} ${al.length?'alerta':''}">
    <div class="marca"><img src="/logo/${esc(e.logo)}" alt=""><b>${esc(e.nome)}</b>${al.length
      ? `<span class="estado alerta">⚠ Fora do corte: ${esc(al.join(', '))}</span>`
      : `<span class="estado ${pendente===0&&!e.carregando?'pronto':''}">${estado}</span>`}</div>
    ${estacao(e,'emitirNF','nf','Emitir NF')}
    ${estacao(e,'aEmpacotar','em','A empacotar')}
    ${coletar(e)}
    <div class="lado">
      <div><b class="n">${fmt(t.enviado)}</b>enviados hoje</div>
      <div><b class="n">${fmt(t.futuros)}</b>próximos dias</div>
    </div>
  </section>`;
}

async function carregar(){
  try{
    const r = await fetch('/tv/dados', {cache:'no-store'});
    if (r.status === 401) { $('aviso').style.display='grid'; $('aviso').textContent = 'Esta TV ainda não tem acesso. Abra o link da TV que está em Conta → Painel da TV.'; return; }
    const d = await r.json();
    if (d.carregando || !d.empresas?.length) { setTimeout(carregar, 4000); return; }
    $('aviso').style.display = 'none';
    $('faixas').innerHTML = d.empresas.map(faixa).join('');
    $('cortes').innerHTML = (d.cortes||[]).map(corte).join('');
    if (d.parcial) setTimeout(carregar, 4000);
    $('atualizado').textContent = d.atualizadoEm && !d.parcial
      ? 'Atualizado às ' + new Date(d.atualizadoEm).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}) + '. Atualiza sozinho a cada 1 a 2 minutos.'
      : 'Carregando as demais empresas…';
    const erros = Object.entries(d.erros||{}).map(([k,v]) => `${k}: ${v}`);
    if (!d.configurado && !d.parcial) erros.unshift('Situações do Bling/Tiny ainda não revisadas em /tv/config');
    $('erros').textContent = erros.join('  |  ');
  }catch(e){ $('erros').textContent = 'Sem conexão com o servidor. Tentando de novo…'; }
}
carregar(); setInterval(carregar, 30000);
setTimeout(() => location.reload(), 6 * 3600e3);
try { navigator.wakeLock?.request('screen').catch(()=>{}); } catch(e){}
</script>
</body>
</html>
